<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="300">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Shine overlay -->
  <rect width="512" height="512" rx="96" fill="url(#shine)"/>

  <!-- Dumbbell handle - bar -->
  <rect x="156" y="236" width="200" height="40" rx="8" fill="url(#accent)"/>

  <!-- Left weight plates -->
  <rect x="116" y="216" width="40" height="80" rx="10" fill="url(#accent)" opacity="0.85"/>
  <rect x="80" y="226" width="36" height="60" rx="8" fill="url(#accent)" opacity="0.7"/>

  <!-- Right weight plates -->
  <rect x="356" y="216" width="40" height="80" rx="10" fill="url(#accent)" opacity="0.85"/>
  <rect x="396" y="226" width="36" height="60" rx="8" fill="url(#accent)" opacity="0.7"/>

  <!-- Inner highlight on bar -->
  <rect x="160" y="246" width="192" height="20" rx="6" fill="white" opacity="0.15"/>

  <!-- Small circle decorative elements -->
  <circle cx="256" cy="456" r="6" fill="#e94560" opacity="0.4"/>
  <circle cx="256" cy="456" r="3" fill="#e94560" opacity="0.6"/>

  <!-- "E" letter mark on center of bar -->
  <text x="256" y="264" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="white" opacity="0.95">E</text>
</svg>
